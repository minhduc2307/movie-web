<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("motphim-theme");
                    if (
                        theme === "dark" ||
                        (!theme &&
                            !window.matchMedia("(prefers-color-scheme: light)")
                                .matches)
                    ) {
                        document.documentElement.classList.add("dark");
                        document.documentElement.style.colorScheme = "dark";
                    } else {
                        document.documentElement.classList.remove("dark");
                        document.documentElement.style.colorScheme = "light";
                    }
                } catch (e) {}
            })();
        </script>
        <meta
            name="description"
            content="Trang xem phim Online với giao diện mới được bố trí và thiết kế thân thiện với người dùng. Nguồn phim được tổng hợp từ các website lớn với đa dạng các đầu phim và thể loại vô cùng phong phú."
        />
        <title>Mọt Phim</title>

        <link rel="preconnect" href="https://phimapi.com" crossorigin />
        <link rel="dns-prefetch" href="https://phimapi.com" />
        <link rel="preconnect" href="https://phimimg.com" />
        <link rel="dns-prefetch" href="https://phimimg.com" />

        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon/apple-icon-180x180.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/favicon/android-icon-192x192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon/favicon-16x16.png"
        />
        <link rel="manifest" href="/favicon/manifest.json" />
        <meta name="theme-color" content="#ffffff" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
